name: Release macOS

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 校验通过后创建公开 GitHub Release 与 release 提交
        required: true
        type: boolean
        default: false
      release_version:
        description: 构建版本，例如 0.2.0（也接受 v0.2.0 或 V0.2.0）
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Prepare release version
        id: release_version
        env:
          CADILUME_RELEASE_VERSION: ${{ inputs.release_version }}
        run: pnpm prepare:release-version

      - name: Ensure release tag is unused
        if: ${{ inputs.publish }}
        shell: bash
        env:
          CADILUME_RELEASE_TAG: ${{ steps.release_version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${CADILUME_RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::发布标签 ${CADILUME_RELEASE_TAG} 已存在；不可变 Release 标签不能覆盖或复用"
            exit 1
          fi

      - name: Setup Rust arm64 target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustup target add aarch64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: macos-arm64-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            macos-arm64-cargo-

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        env:
          CADILUME_PUBLISH: ${{ inputs.publish }}
          CADILUME_RELEASE_TAG: ${{ steps.release_version.outputs.tag }}
        run: pnpm verify:release-version

      - name: Run frontend validation
        run: |
          pnpm check
          pnpm test
          pnpm build

      - name: Run Rust validation
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Create release commit
        id: release_commit
        if: ${{ inputs.publish }}
        shell: bash
        env:
          CADILUME_RELEASE_TAG: ${{ steps.release_version.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin --prune --tags
          base_sha="$(git rev-parse HEAD)"
          remote_main_sha="$(git rev-parse origin/main)"
          remote_dev_sha="$(git rev-parse origin/dev 2>/dev/null || true)"
          if [[ "${base_sha}" != "${remote_main_sha}" ]]; then
            echo "::error::main 在发布验证期间已更新，请从最新 main 重新运行"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "release: ${CADILUME_RELEASE_TAG}"
          elif [[ "$(git log -1 --pretty=%s)" != "release: ${CADILUME_RELEASE_TAG}" ]]; then
            git commit --allow-empty -m "release: ${CADILUME_RELEASE_TAG}"
          fi

          release_sha="$(git rev-parse HEAD)"
          git push origin HEAD:main
          if [[ "${remote_dev_sha}" == "${base_sha}" ]]; then
            if ! git push origin HEAD:dev; then
              echo "::warning::dev 在发布期间已更新，release 提交只推送到了 main"
            fi
          else
            echo "::notice::dev 与发布基线不同，未自动移动 dev"
          fi
          echo "sha=${release_sha}" >> "${GITHUB_OUTPUT}"

      - name: Build manual macOS artifacts
        if: ${{ !inputs.publish }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.conf.json
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: cadilume-macos-arm64-[bundle]

      - name: Publish GitHub Release
        if: ${{ inputs.publish }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.release_version.outputs.tag }}
          releaseName: Cadilume ${{ steps.release_version.outputs.tag }}
          releaseCommitish: ${{ steps.release_commit.outputs.sha }}
          releaseBody: macOS arm64 release. This build is currently ad-hoc signed and not notarized; see the README before installation.
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: --target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.conf.json

      - name: Verify packaged macOS application and DMG
        shell: bash
        env:
          CADILUME_RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          bundle_root="src-tauri/target/aarch64-apple-darwin/release/bundle"
          apps=("${bundle_root}/macos/"*.app)
          dmgs=("${bundle_root}/dmg/"*.dmg)
          updater_archives=("${bundle_root}/macos/"*.app.tar.gz)
          updater_signatures=("${bundle_root}/macos/"*.app.tar.gz.sig)
          if [[ ${#apps[@]} -ne 1 || ${#dmgs[@]} -ne 1 ]]; then
            echo "::error::应生成且仅生成一个 macOS .app 和一个 DMG"
            exit 1
          fi
          if [[ ${#updater_archives[@]} -ne 1 || ${#updater_signatures[@]} -ne 1 ]]; then
            echo "::error::缺少完整的 macOS updater 归档或签名"
            exit 1
          fi

          app="${apps[0]}"
          dmg="${dmgs[0]}"
          executable="${app}/Contents/MacOS/Cadilume"
          info_plist="${app}/Contents/Info.plist"
          test -x "${executable}"
          test -f "${app}/Contents/Resources/icon.icns"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${info_plist}")" == "top.codeh.cadilume" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${info_plist}")" == "${CADILUME_RELEASE_VERSION}" ]]
          lipo -verify_arch arm64 "${executable}"
          codesign --verify --deep --strict --verbose=2 "${app}"

          linked_libraries="$(otool -L "${executable}")"
          grep -q '/System/Library/Frameworks/CoreAudio.framework' <<<"${linked_libraries}"
          grep -q '/System/Library/Frameworks/AudioToolbox.framework' <<<"${linked_libraries}"
          if grep -Eq '/(opt/homebrew|opt/local|usr/local)/' <<<"${linked_libraries}"; then
            echo "::error::发行程序链接了禁止的外部运行依赖"
            printf '%s\n' "${linked_libraries}"
            exit 1
          fi

          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "${mount_dir}" -quiet >/dev/null 2>&1 || true
            rmdir "${mount_dir}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          hdiutil attach "${dmg}" -readonly -nobrowse -mountpoint "${mount_dir}" -quiet
          dmg_apps=("${mount_dir}/"*.app)
          if [[ ${#dmg_apps[@]} -ne 1 ]]; then
            echo "::error::DMG 内应包含且仅包含一个 .app"
            exit 1
          fi
          dmg_app="${dmg_apps[0]}"
          dmg_executable="${dmg_app}/Contents/MacOS/Cadilume"
          test -x "${dmg_executable}"
          codesign --verify --deep --strict --verbose=2 "${dmg_app}"
          cmp "${executable}" "${dmg_executable}"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${dmg_app}/Contents/Info.plist")" == "top.codeh.cadilume" ]]
          echo "macOS DMG 核验通过：arm64、签名、版本、音频系统依赖和 DMG 内应用均完整"

      - name: Upload manual macOS updater artifacts
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: cadilume-macos-arm64-updater
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

      - name: Verify assets and publish immutable Release
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CADILUME_RELEASE_TAG: ${{ steps.release_version.outputs.tag }}
        run: |
          set -euo pipefail
          asset_names="$(gh release view "${CADILUME_RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
          for required_pattern in '\.dmg$' '\.app\.tar\.gz$' '\.app\.tar\.gz\.sig$' '^latest\.json$'; do
            if ! grep -Eq "${required_pattern}" <<<"${asset_names}"; then
              echo "::error::草稿 Release 缺少必要资产（${required_pattern}），保持草稿且不公开"
              exit 1
            fi
          done
          gh release edit "${CADILUME_RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
