<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101112" />
    <style>
      :root {
        color-scheme: dark;
        background: #101112;
      }

      :root[data-theme="light"] {
        color-scheme: light;
        background: #f7f5f2;
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: inherit;
      }
    </style>
    <script>
      (() => {
        let theme;
        try {
          const storedTheme = localStorage.getItem("cadilume-theme");
          if (storedTheme === "light" || storedTheme === "dark") theme = storedTheme;
        } catch {
          // The system theme still gives the startup shell a stable fallback.
        }
        if (!theme) theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";

        const root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
          "content",
          theme === "light" ? "#f7f5f2" : "#101112",
        );
      })();
    </script>
    <link rel="icon" href="/app-icon.svg" type="image/svg+xml" />
    <title>Cadilume</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
