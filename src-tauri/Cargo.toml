[package]
name = "cadilume"
version = "0.3.2"
description = "A lightweight desktop music player for Plex libraries"
authors = ["hoganchou"]
edition = "2021"
rust-version = "1.88"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cadilume_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Keep the Rust crate identifier conventional while giving the executable the
# same capitalized product name that macOS exposes to users in development.
[[bin]]
name = "Cadilume"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
cpal = "0.17"
chacha20poly1305 = "0.11"
filetime = "0.2"
futures-util = "0.3"
fs2 = "0.4"
quick-xml = { version = "0.41", features = ["serialize"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rodio = { version = "0.22", default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav"] }
rubato = { version = "5", default-features = false }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["net", "sync", "time", "macros", "rt-multi-thread"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }
libc = "0.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3.2", features = ["NSData"] }
objc2-core-foundation = "0.3.2"
objc2-core-audio = { version = "0.3.2", features = ["AudioHardware", "AudioHardwareDeprecated"] }
objc2-media-player = { version = "0.3.2", features = ["block2", "objc2-app-kit", "objc2-core-foundation"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
windows = { version = "0.58", features = ["Media", "Media_Playback", "Foundation", "Foundation_Collections", "Storage_Streams", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_WinRT"] }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["linux-native"] }

# The 256-tap sinc path must stay comfortably ahead of realtime in local
# playback builds. Unoptimized rubato spends almost a full core in its NEON
# interpolation loop when converting common 44.1 kHz media to a 48 kHz device.
[profile.dev.package.rubato]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.test.package.rubato]
opt-level = 3
debug-assertions = false
overflow-checks = false
